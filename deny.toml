# MPL-2.0 is allowed for rhai's smartstring dependency (script.run): owner sign-off 2026-11-08. It is outside the house-rules licence allowlist, so do not add other MPL crates without asking.
[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "CC0-1.0", "BSL-1.0", "OFL-1.1", "0BSD"]
confidence-threshold = 0.8

[advisories]
yanked = "warn"

[bans]
multiple-versions = "warn"
